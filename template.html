<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>북꾸러기 캐러셀 v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     추가 웹폰트 (눈누 CDN)
  ============================================================ */
  @font-face {
    font-family: 'JoseonGulim';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@1.0/ChosunGu.woff') format('woff'),
         url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@1.0/ChosunGu.woff') format('woff');
    font-weight: normal;
    font-display: swap;
  }
  @font-face { font-family: 'Pretendard'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Thin.woff2') format('woff2'); font-weight: 100; font-display: swap; }
  @font-face { font-family: 'Pretendard'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-ExtraLight.woff2') format('woff2'); font-weight: 200; font-display: swap; }
  @font-face { font-family: 'Pretendard'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Light.woff2') format('woff2'); font-weight: 300; font-display: swap; }
  @font-face { font-family: 'Pretendard'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Pretendard'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Medium.woff2') format('woff2'); font-weight: 500; font-display: swap; }
  @font-face { font-family: 'Pretendard'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-SemiBold.woff2') format('woff2'); font-weight: 600; font-display: swap; }
  @font-face { font-family: 'Pretendard'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }
  @font-face { font-family: 'Pretendard'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-ExtraBold.woff2') format('woff2'); font-weight: 800; font-display: swap; }
  @font-face { font-family: 'Pretendard'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Black.woff2') format('woff2'); font-weight: 900; font-display: swap; }

  /* ============================================================
     BRAND TOKENS
  ============================================================ */
  :root {
    --lime: #DAF100;
    --ink: #0E0E0E;
    --paper: #FFFFFF;
    --muted: #6B6B66;
    --line: #DCDCDC;

    --font-heading: 'Hahmlet', serif;
    --font-serif-ko: 'Hahmlet', serif;
    --font-sans-ko: 'Noto Sans KR', sans-serif;
    --font-serif-en: 'Fraunces', serif;
    --font-mono: 'JetBrains Mono', monospace;
    --font-chosun-gulim: 'JoseonGulim', 'Noto Sans KR', sans-serif;
    --font-pretendard: 'Pretendard', 'Noto Sans KR', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1080px;
    height: 1350px;
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    font-family: var(--font-serif-ko);
  }

  .slide {
    width: 1080px;
    height: 1350px;
    position: relative;
    background: var(--paper);
    overflow: hidden;
  }

  /* ============================================================
     COMMON HEADER & FOOTER
  ============================================================ */
  .top-row {
    position: absolute;
    top: 75px;
    left: 75px;
    right: 75px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    z-index: 10;
  }
  .top-row .label-block {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .top-row .label-bar {
    width: 60px;
    height: 5px;
    background: var(--ink);
  }
  .top-row .label-text {
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--ink);
  }
  .top-row .page-num {
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.05em;
    color: var(--ink);
  }

  .footer-row {
    position: absolute;
    bottom: 75px;
    left: 75px;
    right: 75px;
    padding-top: 25px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.05em;
  }

  /* ============================================================
     COVER A — 좌우 분할 (좌측 텍스트 + 우측 사진)
  ============================================================ */
  .cover-a .photo-area {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 44%;
    background: #F0F0F0;
    background-size: cover;
    background-position: center;
  }
  .cover-a .photo-area.has-photo { background-color: transparent; }
  .cover-a .photo-placeholder {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: #999;
    font-family: var(--font-mono);
    font-size: 18px;
  }
  .cover-a .photo-placeholder span {
    display: block;
    font-size: 14px;
    color: #BBB;
    margin-top: 8px;
  }
  .cover-a .text-area {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 56%;
    padding: 75px;
  }
  .cover-a .title-stack {
    margin-top: 240px;
  }
  .cover-a .title-line {
    font-family: var(--font-heading);
    font-weight: 900;
    font-size: 130px;
    line-height: 1.05;
    letter-spacing: -0.04em;
    color: var(--ink);
    word-break: keep-all;
    display: block;
  }
  .cover-a .title-line.highlight {
    background: var(--lime);
    padding: 0 14px;
    margin-left: -14px;
    display: inline-block;
  }
  .cover-a .footer-row {
    right: auto;
    width: calc(56% - 150px);
  }

  /* ============================================================
     COVER B — 상하 분할 (상단 사진 + 하단 텍스트)
  ============================================================ */
  .cover-b .photo-area {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 52%;
    background: #F0F0F0;
    background-size: cover;
    background-position: center;
  }
  .cover-b .photo-area.has-photo { background-color: transparent; }
  .cover-b .photo-placeholder {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: #999;
    font-family: var(--font-mono);
    font-size: 18px;
  }
  .cover-b .photo-placeholder span {
    display: block;
    font-size: 14px;
    color: #BBB;
    margin-top: 8px;
  }
  .cover-b .text-area {
    position: absolute;
    top: 52%;
    left: 0; right: 0; bottom: 0;
    padding: 80px 75px 75px;
  }
  .cover-b .title-stack {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0;
  }
  .cover-b .title-line {
    font-family: var(--font-heading);
    font-weight: 900;
    font-size: 110px;
    line-height: 1.1;
    letter-spacing: -0.04em;
    color: var(--ink);
    word-break: keep-all;
    margin-right: 24px;
  }
  .cover-b .title-line.highlight {
    background: var(--lime);
    padding: 0 14px;
    margin-right: 24px;
  }
  .cover-b .title-line.full-row {
    width: 100%;
    margin-right: 0;
  }

  /* ============================================================
     COVER C — 풀블리드 사진 + 좌하단 텍스트 카드
  ============================================================ */
  .cover-c .photo-area {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #F0F0F0;
    background-size: cover;
    background-position: center;
  }
  .cover-c .photo-area.has-photo { background-color: transparent; }
  .cover-c .photo-placeholder {
    position: absolute;
    top: 35%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: #999;
    font-family: var(--font-mono);
    font-size: 22px;
  }
  .cover-c .photo-placeholder span {
    display: block;
    font-size: 16px;
    color: #BBB;
    margin-top: 10px;
  }
  .cover-c .text-card {
    position: absolute;
    left: 60px;
    bottom: 60px;
    width: 720px;
    background: var(--paper);
    padding: 65px 65px 55px;
  }
  .cover-c .text-card .label-block {
    margin-bottom: 30px;
  }
  .cover-c .text-card .label-bar {
    width: 60px;
    height: 5px;
    background: var(--ink);
    margin-bottom: 14px;
  }
  .cover-c .text-card .label-text {
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.12em;
  }
  .cover-c .title-stack {
    margin-bottom: 40px;
  }
  .cover-c .title-line {
    font-family: var(--font-heading);
    font-weight: 900;
    font-size: 96px;
    line-height: 1.05;
    letter-spacing: -0.04em;
    color: var(--ink);
    word-break: keep-all;
    display: block;
  }
  .cover-c .title-line.highlight {
    background: var(--lime);
    padding: 0 14px;
    margin-left: -14px;
    display: inline-block;
  }
  .cover-c .card-footer {
    padding-top: 25px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.05em;
  }

  /* ============================================================
     BODY (BOOK CONTENT) — 공통 요소
  ============================================================ */
  .book-cover-img {
    object-fit: cover;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
  }
  .book-cover-placeholder {
    background: #F0F0F0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #999;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
  }
  .book-cover-placeholder .ph-icon {
    width: 80px;
    height: 110px;
    border: 2px solid #999;
    position: relative;
    margin-bottom: 20px;
  }
  .book-cover-placeholder .ph-icon::before {
    content: '';
    position: absolute;
    left: 15px;
    top: 0; bottom: 0;
    width: 2px;
    background: #999;
  }
  .book-cover-placeholder .ph-label {
    font-family: var(--font-mono);
    font-size: 16px;
    color: #999;
    letter-spacing: 0.1em;
  }

  /* 평점 점 */
  .rating-dots {
    display: flex;
    gap: 9px;
  }
  .rating-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 1px solid var(--ink);
    background: var(--paper);
  }
  .rating-dot.filled {
    background: var(--lime);
  }

  /* 메타 라벨 */
  .meta-label {
    font-family: var(--font-mono);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 14px;
  }

  /* 본문 — 공통 */
  .book-body {
    font-family: var(--font-serif-ko);
    font-weight: 500;
    color: var(--ink);
    word-break: keep-all;
  }
  .book-body .quote-mark {
    font-family: var(--font-serif-en);
    color: var(--lime);
    -webkit-text-stroke: 1px var(--ink);
    line-height: 0.8;
    display: block;
  }

  /* ============================================================
     BODY 1 — 책 표지 좌측 + 정보 우측 + 본문 하단
  ============================================================ */
  .body-1 .top-section {
    position: absolute;
    top: 200px;
    left: 75px;
    right: 75px;
    display: flex;
    gap: 50px;
  }
  .body-1 .book-cover-area {
    width: 380px;
    height: 540px;
    flex-shrink: 0;
  }
  .body-1 .book-cover-area img,
  .body-1 .book-cover-area .book-cover-placeholder {
    width: 100%;
    height: 100%;
  }
  .body-1 .info-area {
    flex: 1;
    padding-top: 20px;
  }
  .body-1 .book-tag-bar {
    width: 50px;
    height: 5px;
    background: var(--ink);
    margin-bottom: 14px;
  }
  .body-1 .book-tag {
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.12em;
    margin-bottom: 30px;
  }
  .body-1 h2.book-title {
    font-family: var(--font-heading);
    font-weight: 900;
    font-size: 76px;
    line-height: 1.05;
    letter-spacing: -0.03em;
    color: var(--ink);
    word-break: keep-all;
    margin-bottom: 24px;
  }
  .body-1 .book-author {
    font-family: var(--font-sans-ko);
    font-size: 28px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 60px;
  }
  .body-1 .meta-block {
    margin-bottom: 50px;
  }
  .body-1 .reading-time {
    font-family: var(--font-serif-ko);
    font-weight: 700;
    font-size: 36px;
    color: var(--ink);
  }
  .body-1 .body-text-area {
    position: absolute;
    bottom: 200px;
    left: 75px;
    right: 75px;
  }
  .body-1 .body-text-area .quote-mark {
    font-size: 60px;
    margin-bottom: 8px;
  }
  .body-1 .book-body-text {
    font-family: var(--font-serif-ko);
    font-weight: 700;
    font-size: 30px;
    line-height: 1.6;
    color: var(--ink);
    word-break: keep-all;
    /* 단어 단위 줄바꿈 보장 */
    overflow-wrap: normal;
    word-wrap: normal;
  }

  /* ============================================================
     BODY 2 — 책 정보 상단 + 본문 크게 하단
  ============================================================ */
  .body-2 .top-section {
    position: absolute;
    top: 200px;
    left: 75px;
    right: 75px;
    display: flex;
    gap: 50px;
  }
  .body-2 .book-cover-area {
    width: 240px;
    height: 340px;
    flex-shrink: 0;
  }
  .body-2 .book-cover-area img,
  .body-2 .book-cover-area .book-cover-placeholder {
    width: 100%;
    height: 100%;
  }
  .body-2 .info-area {
    flex: 1;
    padding-top: 8px;
  }
  .body-2 .book-tag-bar {
    width: 50px;
    height: 5px;
    background: var(--ink);
    margin-bottom: 14px;
  }
  .body-2 .book-tag {
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.12em;
    margin-bottom: 24px;
  }
  .body-2 h2.book-title {
    font-family: var(--font-heading);
    font-weight: 900;
    font-size: 72px;
    line-height: 1.05;
    letter-spacing: -0.03em;
    color: var(--ink);
    word-break: keep-all;
    margin-bottom: 18px;
  }
  .body-2 .book-author {
    font-family: var(--font-sans-ko);
    font-size: 28px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 38px;
  }
  /* 메타 라인 — 평점/시간 가로 배치, 점 중심선 = 시간 글자 중심선 */
  .body-2 .meta-row {
    display: flex;
    gap: 70px;
    align-items: flex-start;
  }
  .body-2 .meta-col .meta-label {
    margin-bottom: 18px;
  }
  .body-2 .reading-time-row {
    display: flex;
    align-items: center;
    height: 30px; /* 점과 글자의 가상 라인 높이 */
  }
  .body-2 .reading-time {
    font-family: var(--font-serif-ko);
    font-weight: 700;
    font-size: 30px;
    color: var(--ink);
    line-height: 1;
  }
  .body-2 .meta-col .rating-dots {
    height: 30px;
    align-items: center;
  }
  /* 본문 영역 */
  .body-2 .body-section {
    position: absolute;
    top: 720px;
    left: 75px;
    right: 75px;
    bottom: 200px;
  }
  .body-2 .body-divider {
    width: 100%;
    height: 2px;
    background: var(--ink);
    margin-bottom: 50px;
  }
  .body-2 .body-text-area .quote-mark {
    font-size: 70px;
    margin-bottom: 8px;
  }
  .body-2 .book-body-text {
    font-family: var(--font-serif-ko);
    font-weight: 700;
    font-size: 38px;
    line-height: 1.55;
    color: var(--ink);
    word-break: keep-all;
    overflow-wrap: normal;
    word-wrap: normal;
  }

  /* ============================================================
     BODY 3 — 책 표지 중앙 + 모든 텍스트 가운데 정렬
  ============================================================ */
  .body-3 .center-section {
    position: absolute;
    top: 180px;
    left: 0;
    right: 0;
    text-align: center;
  }
  .body-3 .book-cover-area {
    width: 320px;
    height: 460px;
    margin: 0 auto 50px;
  }
  .body-3 .book-cover-area img,
  .body-3 .book-cover-area .book-cover-placeholder {
    width: 100%;
    height: 100%;
  }
  .body-3 h2.book-title {
    font-family: var(--font-heading);
    font-weight: 900;
    font-size: 70px;
    line-height: 1.05;
    letter-spacing: -0.03em;
    color: var(--ink);
    word-break: keep-all;
    margin-bottom: 18px;
  }
  .body-3 .book-author {
    font-family: var(--font-sans-ko);
    font-size: 28px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 28px;
  }
  /* 메타 한 줄 */
  .body-3 .meta-line {
    display: inline-flex;
    align-items: center;
    gap: 18px;
    margin-bottom: 50px;
    height: 28px;
  }
  .body-3 .meta-line .rating-dots {
    align-items: center;
    height: 28px;
  }
  .body-3 .meta-line .meta-sep {
    font-family: var(--font-serif-ko);
    color: var(--muted);
    font-size: 22px;
    line-height: 1;
  }
  .body-3 .meta-line .reading-time {
    font-family: var(--font-serif-ko);
    font-weight: 700;
    font-size: 28px;
    color: var(--ink);
    line-height: 1;
  }
  /* 본문 가운데 정렬 */
  .body-3 .body-text-area {
    padding: 0 100px;
  }
  .body-3 .book-body-text {
    font-family: var(--font-serif-ko);
    font-weight: 700;
    font-size: 30px;
    line-height: 1.6;
    color: var(--ink);
    word-break: keep-all;
    text-align: center;
    overflow-wrap: normal;
    word-wrap: normal;
  }

  /* ============================================================
     INTRO 1 — 미니멀 (헤드라인 없음, 단락만 크게)
     "표지 다음 한 호흡 쉬어가는 페이지" 톤
  ============================================================ */
  .intro-1 .text-block {
    position: absolute;
    top: 280px;
    left: 75px;
    right: 75px;
    bottom: 200px;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
  }
  .intro-1 .intro-mark {
    width: 60px;
    height: 5px;
    background: var(--lime);
    margin-bottom: 50px;
  }
  .intro-1 .intro-paragraph {
    font-family: var(--font-serif-ko);
    font-weight: 900;
    font-size: 38px;
    line-height: 1.6;
    letter-spacing: -0.02em;
    color: var(--ink);
    word-break: keep-all;
    overflow-wrap: normal;
    margin-bottom: 32px;
  }
  .intro-1 .intro-paragraph:last-child {
    margin-bottom: 0;
  }

  /* ============================================================
     INTRO 2 — 헤드라인 + 단락 (라임 형광펜 강조)
     표지 톤 그대로 이어지는 에디토리얼 느낌
  ============================================================ */
  .intro-2 .headline-block {
    position: absolute;
    top: 200px;
    left: 75px;
    right: 75px;
  }
  .intro-2 .headline {
    font-family: var(--font-heading);
    font-weight: 900;
    font-size: 76px;
    line-height: 1.15;
    letter-spacing: -0.03em;
    color: var(--ink);
    word-break: keep-all;
  }
  .intro-2 .headline .hl {
    background: var(--lime);
    padding: 0 10px;
    margin: 0 -2px;
  }
  .intro-2 .body-block {
    position: absolute;
    top: 600px;
    left: 75px;
    right: 75px;
    bottom: 200px;

  .intro-2 .body-divider {

  /* ============================================================
     INTRO 3 — 큰 따옴표 + 단락 가운데 정렬
     일기장/편지 같은 사적인 톤
  ============================================================ */
  .intro-3 .text-block {
    position: absolute;
    top: 220px;
    left: 0;
    right: 0;
    bottom: 200px;
    padding: 0 110px;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
  }
  .intro-3 .quote-mark {
    font-family: var(--font-serif-en);
    font-weight: 900;
    font-style: italic;
    font-size: 180px;
    line-height: 0.8;
    color: var(--lime);
    margin-bottom: 30px;
    letter-spacing: -0.05em;
  }
  .intro-3 .intro-paragraph {
    font-family: var(--font-serif-ko);
    font-weight: 500;
    font-size: 34px;
    line-height: 1.7;
    letter-spacing: -0.01em;
    color: var(--ink);
    word-break: keep-all;
    overflow-wrap: normal;
    margin-bottom: 28px;
    max-width: 820px;
  }
  .intro-3 .intro-paragraph:last-child {
    margin-bottom: 0;
  }
  .intro-3 .sign {
    margin-top: 40px;
    font-family: var(--font-serif-en);
    font-style: italic;
    font-size: 30px;
    color: var(--muted);
  }

  /* ============================================================
     OUTRO — 엔딩 시안 2 (좌측 정렬, 큰 임팩트)
  ============================================================ */
  .outro {
    background: var(--paper);
  }
  .outro .main-stack {
    position: absolute;
    top: 240px;
    left: 75px;
    right: 75px;
  }
  .outro .main-line {
    font-family: var(--font-heading);
    font-weight: 900;
    font-size: 130px;
    line-height: 1.0;
    letter-spacing: -0.04em;
    color: var(--ink);
    margin-bottom: 18px;
    display: block;
  }
  .outro .main-line.highlight {
    background: var(--lime);
    padding: 0 14px;
    margin-left: -14px;
    display: inline-block;
  }
  .outro .going-row {
    display: inline-flex;
    align-items: baseline;
    gap: 18px;
  }
  .outro .lime-dot {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--lime);
    border: 2px solid var(--ink);
    display: inline-block;
    flex-shrink: 0;
    align-self: flex-end;
    margin-bottom: 18px;
  }
  /* 사인 */
  .outro .signature {
    margin-top: 50px;
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  .outro .sign-lead {
    font-family: var(--font-serif-en);
    font-size: 36px;
    font-weight: 400;
    color: var(--ink);
  }
  .outro .sign-handle {

    font-size: 40px;
    font-weight: 600;
    color: var(--ink);

  /* CTA 영역 */
  .outro .cta-section {
    position: absolute;
    bottom: 180px;
    left: 75px;
    right: 75px;
    border-top: 2px solid var(--ink);
    padding-top: 35px;
  }
  .outro .cta-question {
    font-family: var(--font-serif-ko);
    font-weight: 700;
    font-size: 32px;
    color: var(--ink);
    margin-bottom: 30px;
  }
  .outro .cta-buttons {
    display: flex;
    gap: 16px;
  }
  .outro .cta-btn {
    font-family: var(--font-sans-ko);
    font-size: 26px;
    font-weight: 700;
    color: var(--ink);
    padding: 14px 32px;
    border: 1.5px solid var(--ink);
    background: var(--paper);

  }
  .outro .cta-btn.primary {
    background: var(--lime);
  }
  .outro .thanks {
    position: absolute;
    bottom: 80px;
    right: 75px;
    font-family: var(--font-serif-en);
    font-size: 24px;
    font-style: italic;

  .outro .label-block {
    position: absolute;
    top: 75px;
    left: 75px;
  }
  .outro .page-num {

    top: 75px;
    right: 75px;
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 500;

  }

  /* ============================================================
     FREE PAGE — 자유 배치 페이지 (사진 + 텍스트 자유 조합)
  ============================================================ */
  .free-page {
    background: var(--paper);
  }
  .free-page .fp-text-zone {
    position: absolute;
    top: 190px;
    bottom: 210px;
    left: 95px;
    right: 95px;
    display: flex;
    flex-direction: column;
    gap: 42px;
    z-index: 1;
  }
  .free-page .fp-title {
    font-family: var(--font-heading);
    font-weight: 900;
    font-size: 62px;
    line-height: 1.32;
    letter-spacing: -0.01em;
    color: var(--ink);
    word-break: keep-all;
    max-width: 760px;
  }
  .free-page .fp-emphasis {
    font-family: var(--font-heading);
    font-weight: 800;
    font-size: 42px;
    line-height: 1.55;
    color: var(--ink);
    word-break: keep-all;
    max-width: 720px;
  }
  .free-page .fp-emphasis .hl {
    background: linear-gradient(transparent 58%, var(--lime) 58%);
    padding: 0 4px;
  }
  .free-page .fp-box {
    font-family: var(--font-sans-ko);
    font-weight: 500;
    font-size: 29px;
    line-height: 1.75;
    color: var(--ink);
    border: 1.5px solid var(--ink);
    background: var(--paper);
    padding: 34px 38px;
    word-break: keep-all;

  .free-page .fp-plain {

    font-weight: 500;
    font-size: 31px;
    line-height: 1.8;
    color: var(--ink);
    word-break: keep-all;
    max-width: 700px;
  }
  .free-page .fp-caption {
    font-family: var(--font-mono);
    font-size: 20px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--muted);
    word-break: keep-all;
    max-width: 640px;
  }

  /* 배치되는 이미지 */
  .free-page .fp-img {
    position: absolute;
    z-index: 2;
    transform: translate(var(--tx, 0), var(--ty, 0)) rotate(var(--tilt, 0deg));
  }
  .free-page .fp-img img {
    display: block;
    width: 100%;
    height: auto;
  }
  .free-page .fp-img.polaroid img,
  .free-page .fp-img.polaroid .fp-img-ph {
    border: 12px solid #fff;
    box-shadow: 0 10px 32px rgba(14, 14, 14, 0.22);
  }
  .free-page .fp-img.plain img,
  .free-page .fp-img.plain .fp-img-ph {
    box-shadow: 12px 12px 0 var(--lime), 0 8px 26px rgba(14, 14, 14, 0.18);
  }
  .free-page .fp-img-ph {
    width: 100%;
    aspect-ratio: 3 / 4;
    background: #F0F0F0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 16px;
    font-family: var(--font-mono);
    font-size: 17px;
    color: #999;
    word-break: break-all;
    box-sizing: border-box;
  }

  /* ============================================================
     라벨 제거 (v3.3) — VOL/BOOK/PROLOGUE 라벨과 검정 막대를
     모든 슬라이드에서 숨김. 페이지 번호(02/06)는 유지.
     되돌리려면 이 블록만 삭제하면 됨.
  ============================================================ */
  .label-block { display: none !important; }
  .top-row { justify-content: flex-end; }

  /* ── 배경 사진 페이지 (레퍼런스: 풀블리드 사진 + 오버레이 텍스트) ── */
  .free-page .fp-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    z-index: 0;
  }
  .free-page .fp-bg-dim {
    position: absolute;
    inset: 0;
    z-index: 0;
  }
  .free-page .fp-bg-ph {
    background: linear-gradient(160deg, #B9BDB6, #7E847C);
    display: flex;
    align-items: flex-end;
    justify-content: flex-start;
    padding: 24px;
  }
  .free-page .fp-bg-ph span {
    font-family: var(--font-mono);
    font-size: 17px;
    color: rgba(255,255,255,0.85);
  }
  /* 배경 사진 위에서는 페이지 번호·푸터를 흰색으로 */
  .free-page.has-bg .top-row .page-num {
    color: #fff;
    text-shadow: 0 1px 8px rgba(0,0,0,0.45);
  }
  .free-page.has-bg .footer-row {
    color: #fff;
    border-top-color: rgba(255,255,255,0.45);
    text-shadow: 0 1px 8px rgba(0,0,0,0.45);
  }

  /* ── 오버레이 박스 (사진 위 불투명 박스) ── */
  .free-page .fp-overlay-box {
    font-family: var(--font-chosun-gulim);
    font-weight: 400;
    font-size: 26px;
    line-height: 1.75;
    padding: 28px 32px;
    word-break: keep-all;
    max-width: 720px;
    align-self: flex-start;
    border: 1.5px solid var(--ink);
    transform: scaleX(0.92);
    transform-origin: left;
  }
  .free-page .fp-overlay-box.tone-light { background: rgba(255,255,255,0.95); color: var(--ink); }
  .free-page .fp-overlay-box.tone-dark  { background: rgba(14,14,14,0.90); color: #fff; }
  .free-page .fp-overlay-box.tone-lime  { background: var(--lime); color: var(--ink); }

  /* ── 줄 단위 하이라이트 (인용·대사) ── */
  .free-page .fp-linehl {
    font-family: var(--font-pretendard);
    font-weight: 500;
    font-size: 31px;
    line-height: 2.15;
    word-break: keep-all;
    max-width: 780px;
  }
  .free-page .fp-linehl .ln {
    padding: 7px 16px;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
  }
  .free-page .fp-linehl.tone-dark .ln  { background: rgba(14,14,14,0.82); color: #FAFAF7; }
  .free-page .fp-linehl.tone-light .ln { background: rgba(255,255,255,0.93); color: var(--ink); }
  .free-page .fp-linehl.tone-lime .ln  { background: var(--lime); color: var(--ink); }

  /* ── 번호 뱃지 (❷ 당인리책발전소) ── */
  .free-page .fp-badge {
    display: flex;
    align-items: center;
    gap: 16px;
    align-self: flex-start;
  }
  .free-page .fp-badge .bnum {
    width: 52px;
    height: 52px;
    border-radius: 999px;
    background: var(--ink);
    color: #fff;
    font-family: var(--font-mono);
    font-size: 26px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }
  .free-page .fp-badge .btxt {
    background: var(--lime);
    color: var(--ink);
    font-family: var(--font-heading);
    font-weight: 800;
    font-size: 34px;
    letter-spacing: -0.01em;
    padding: 10px 22px;
    word-break: keep-all;
  }

  /* ============================================================
     v4 타이포그래피 & 레이아웃
     - 표지: 프리텐다드 900 / 장평 84% + forWhom 박스(조선굴림 100%)
     - 인트로: 타원 사진 + 글 흐름, 프리텐다드 300 / 장평 88%
     - 본문 mix 3구성 / 엔딩 질문형
  ============================================================ */

  /* ── 표지 제목: 프리텐다드 900 장평 84% ── */
  .slide .title-line {
    font-family: var(--font-pretendard) !important;
    font-weight: 900 !important;
    display: inline-block;
    transform: scaleX(0.84);
    transform-origin: left;
  }
  /* forWhom 오버레이 박스 (조선굴림 100%)
     — 사진 영역 중심에서 약간 오른쪽, 라임 테두리(기존 1.5px의 1.5배 = 2.25px) */
  .cover-forwhom {
    position: absolute;
    transform: translate(-50%, -50%);
    background: #FFFFFF;
    border: 2.25px solid var(--lime);
    padding: 16px 26px;
    font-family: var(--font-chosun-gulim);
    font-size: 27px;
    line-height: 1.55;
    color: var(--ink);
    word-break: keep-all;
    max-width: 560px;
    z-index: 5;
  }
  /* 위치: 각 커버의 사진 영역을 3분할했을 때 오른쪽-아래 교차점 (박스 중심 기준) */
  /* 전 페이지 푸터 프리텐다드 통일 + 태그라인(장평 84%) */
  .footer-row {
    font-family: var(--font-pretendard);
  }
  .fr-tag {
    display: inline-block;
    transform: scaleX(0.84);
    transform-origin: left;
    margin-left: 16px;
    font-weight: 700;
  }
  /* 표지 푸터(@아이디 · SWIPE →)를 표지 글씨체(프리텐다드)로 통일 */
  .cover-a .footer-row,
  .cover-b .footer-row {
    font-family: var(--font-pretendard);
    font-weight: 700;
  }
  .cover-c .card-footer {
    font-family: var(--font-pretendard) !important;
    font-weight: 700;
  }
  /* 커버 B: 사진 밴드 1080x702 → 교차점 (720, 468) */
  .cover-b .cover-forwhom { top: 468px; left: 720px; }
  /* 커버 A: 사진 기둥 x605~1080, y0~1350 → 교차점 (922, 900). 기둥 폭에 맞춰 좁게 */
  .cover-a .cover-forwhom { top: 900px; left: 922px; max-width: 300px; }
  /* 커버 C: 풀블리드 1080x1350 → 교차점 (720, 900) */
  .cover-c .cover-forwhom { top: 900px; left: 720px; }

  /* ── 인트로: 타원 사진 + 글 흐름 ──
     원리: 좌/우 float에 shape-outside 반타원을 새겨 글이 타원을 피해 흐르고,
     사진은 같은 자리(중앙)에 절대배치. 텍스트 래퍼에 장평 88%를 적용하므로
     사진 가로폭은 88%를 보정한 값(레이아웃 470px → 표시 410px)을 사용. */
  .intro-photo .ipx {
    position: absolute;
    top: 170px;
    bottom: 185px;
    left: 70px;
    right: 70px;
    transform: scaleX(0.88);
    transform-origin: top center;
    font-family: var(--font-pretendard);
    font-weight: 300;
    font-size: 29px;
    line-height: 1.9;
    color: var(--ink);
    word-break: keep-all;
    text-align: justify;
    overflow: clip;
    overflow-clip-margin: 36px;   /* 경계를 넘는 타원(+30px)이 잘리지 않도록 */
  }
  .intro-photo .ip-para { margin: 0 0 22px; }
  /* 타원: 오른쪽, 원래 크기(시각 410x556). 글이 곡선을 따라 왼쪽으로 감김.
     박스(500px)를 타원(466px 레이아웃)보다 넓게 잡아 shape-margin이 잘리지 않게 함 */
  .intro-photo .oval-float {
    float: right;
    width: 500px;
    height: 556px;
    margin-top: 120px;
    shape-outside: ellipse(233px 278px at 297px 398px);  /* 텍스트 경계선 +30px 오른쪽 */
    shape-margin: 24px;
    position: relative;
  }
  .intro-photo .oval-img {
    position: absolute;
    top: 0;
    left: 297px;
    width: 410px;
    height: 556px;
    transform: translateX(-50%) scaleX(1.1364);  /* 부모 88% 압축 역보정 (사진 왜곡 방지) */
    transform-origin: center;
    border-radius: 50%;
    border: 1.5px solid var(--ink);              /* 오버레이 사각형과 동일한 검정 테두리 */
    object-fit: cover;
  }
  .intro-photo .oval-ph {
    background: linear-gradient(160deg, #C9CDC5, #8B9188);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .intro-photo .oval-ph span {
    font-family: var(--font-mono);
    font-size: 17px;
    color: rgba(255,255,255,0.9);
  }

  /* ── 공통: 오버레이 본문용 조선굴림 92% ── */
  .cg92 {
    display: inline-block;
    transform: scaleX(0.92);
    transform-origin: left;
    font-family: var(--font-chosun-gulim);
  }
  /* 폭이 고정된 패널 안에서는 글 폭을 역보정해 좌우 여백을 균등하게 */
  .bp-panel .cg92, .bi-box .cg92,
  .bq-panel .cg92, .bpl-box .cg92, .bmg-body .cg92 {
    display: block;
    width: calc(100% / 0.92);
  }
  /* keep-all 줄끝 들쭉임을 양끝 정렬로 정리 */
  .body-photo .bp-body,
  .body-inset .bi-box,
  .body-quote .bq-body,
  .body-polaroid .bpl-box,
  .body-magazine .bmg-body,
  .free-page .fp-overlay-box {
    text-align: justify;
  }

  /* ── 본문 메타 라인 (저자 · 평점 · 시간) ── */
  .bm-meta {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
  }
  .bm-meta .bm-author {
    font-family: var(--font-pretendard);
    font-weight: 500;
    font-size: 24px;
    color: var(--muted);
  }
  .bm-meta .bm-time {
    font-family: var(--font-mono);
    font-size: 21px;
    color: var(--muted);
  }
  .bm-meta .rating-dots { display: flex; gap: 7px; }
  .bm-meta .rating-dot {
    width: 15px; height: 15px; border-radius: 999px;
    border: 1.5px solid var(--ink);
  }
  .bm-meta .rating-dot.filled { background: var(--lime); }

  /* 읽는 예상 시간: 조선굴림 */
  .bm-meta .bm-time,
  .slide .reading-time {
    font-family: var(--font-chosun-gulim);
  }

  /* ── 본문 구성 1: 사진 배경 + 하단 흰 패널 ── */
  .body-photo .fpv-bg, .body-quote .fpv-bg, .body-polaroid .fpv-bg {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    z-index: 0;
  }
  .body-photo .fpv-dim, .body-quote .fpv-dim, .body-polaroid .fpv-dim {
    position: absolute; inset: 0;
    background: rgba(10,10,10,0.30);
    z-index: 0;
  }
  .body-photo .fpv-bg-ph, .body-quote .fpv-bg-ph, .body-polaroid .fpv-bg-ph {
    background: linear-gradient(160deg, #B9BDB6, #7E847C);
    display: flex; align-items: flex-start; justify-content: flex-start;
    padding: 130px 90px;
  }
  .body-photo .fpv-bg-ph span, .body-quote .fpv-bg-ph span, .body-polaroid .fpv-bg-ph span { font-family: var(--font-mono); font-size: 17px; color: rgba(255,255,255,0.85); }
  .body-photo .top-row .page-num, .body-quote .top-row .page-num, .body-polaroid .top-row .page-num { color: #fff; text-shadow: 0 1px 8px rgba(0,0,0,0.45); }
  .body-photo .footer-row, .body-quote .footer-row, .body-polaroid .footer-row { color: #fff; border-top-color: rgba(255,255,255,0.45); text-shadow: 0 1px 8px rgba(0,0,0,0.45); }
  .body-photo .bp-cover {
    position: absolute;
    top: 165px; right: 85px;
    width: 230px;
    transform: rotate(var(--tilt, -3deg));
    z-index: 2;
  }
  .body-photo .bp-cover-img {
    width: 100%; display: block;
    box-shadow: 0 12px 34px rgba(14,14,14,0.35);
  }
  .body-photo .bp-panel {
