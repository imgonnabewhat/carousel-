name: 카드뉴스 생성

# 실행 조건: generated_data.json / photos / covers 변경 시 자동, Run workflow 수동 가능
on:
  workflow_dispatch:
  push:
    paths:
      - 'generated_data.json'
      - 'photos/**'
      - 'covers/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # 키를 job 레벨에 주입 — 어느 단계에서든 항상 사용 가능 (배치 실수 면역)
    env:
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 의존성 설치
        run: npm install

      - name: 이미지 자동 수집 (네이버 표지 + 사진 API)
        run: node fetch_images.js

      - name: PNG 생성
        run: node generate.js

      - name: 완성된 PNG 업로드 (Artifacts에서 다운로드)
        uses: actions/upload-artifact@v4
        with:
          name: carousel-png
          path: output/
          retention-days: 14

      - name: 수집된 이미지를 저장소에 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add covers generated_data.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: 이미지 자동 수집 [skip ci]"
            git pull --rebase origin main   # 실행 중 생긴 원격 커밋과 합친 뒤 푸시
            git push
          fi

      - name: Publish PNGs to output branch
        if: success()
        run: |
          set -e
          SRC=$(ls -d output/*/ | head -n 1)
          if [ -z "$SRC" ]; then echo "no output"; exit 0; fi
          rm -rf /tmp/pub && mkdir -p /tmp/pub
          cp "$SRC"*.png /tmp/pub/
          cd /tmp/pub
          git init -b output
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "latest carousel ($(date +%Y-%m-%d))"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
